# Photographs for the Elsewhere page.
#
#   group   - the heading this photo sits under. Use the same spelling for
#             every photo in a set; sections appear in the order the groups
#             first show up in this file. Anything you like: "Delhi", "At the
#             water", "2024", "Things I cooked".
#   image   - filename inside /images/elsewhere/
#   caption - the part worth writing, and the reason the page is interesting.
#             A sentence in your voice beats a label.
#   alt     - screen-reader description. Falls back to the caption.
#
# Nothing is cropped: portrait and landscape both sit fine in the grid, and
# clicking a photo opens it full size. Save them around 1400px on the long
# edge. The page stays switched off until there is at least one entry here.
#
# A note worth keeping in mind: anyone recognisable in a photograph has not
# agreed to appear on a public academic page. Faces of friends and family are
# worth a second thought, or a crop.

