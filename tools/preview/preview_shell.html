<title>Simran Koul, site preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>

:root{
  --paper:#faf9f7; --ink:#1c1c1b; --muted:#6f6e69;
  --rule:#e4e2dd; --edge:#d2cfc8; --accent:#2f4858;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"Spectral",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; background-color:var(--paper);
  background-image:url("__DOODLE_A__"),url("__DOODLE_B__");
  background-size:300px 300px,211px 211px;
  background-repeat:repeat,repeat; background-attachment:fixed,fixed;
  color:var(--ink); font-family:var(--body); font-size:16.5px; line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}

/* masthead ------------------------------------------------------------- */
.masthead{position:sticky;top:0;z-index:40;background:rgba(250,249,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.mastinner{max-width:780px;margin:0 auto;padding:.85rem 1.5rem;display:flex;align-items:baseline;gap:1.4rem;flex-wrap:wrap}
.site-title{font-family:var(--display);font-weight:400;font-size:1.02rem;letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.tabs{display:flex;gap:1.3rem;margin-left:auto;flex-wrap:wrap}
.tab{font-family:var(--display);font-size:.95rem;font-weight:400;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.tab:hover{color:var(--accent)}
.tab.is-active{color:var(--muted)}


.panel{display:none}
.panel.is-active{display:block}

/* shell ---------------------------------------------------------------- */
.wrap{max-width:780px;margin:0 auto;padding:0 1.5rem}
.narrow,.col{max-width:64ch}
.band{padding:1.5rem 0}
.band:first-of-type{padding:1.4rem 0 .3rem}

/* type ----------------------------------------------------------------- */
.page__content h1.display{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.22;letter-spacing:-.005em;margin:0 0 .35rem;border:0}
.page__content h2,.page__content h3{border-bottom:0}
.page__content p{max-width:62ch;font-family:var(--display);font-size:1.04rem;line-height:1.62}
.page__content a:not(.btn){color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--edge)}
.page__content a:not(.btn):hover{color:var(--accent);text-decoration-color:var(--accent)}
.aff{font-family:var(--display);font-style:italic;font-size:1rem;color:var(--muted);margin:0 0 1.1rem}

.shead{display:flex;align-items:baseline;gap:1rem;margin:0 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--rule)}
.shead h2{font-family:var(--display);font-size:1.42rem;font-weight:400;line-height:1.2;letter-spacing:-.004em;text-transform:none;color:var(--ink);margin:0}
.more{margin-left:auto;font-size:.76rem;color:var(--muted);white-space:nowrap;text-decoration:none}
.more:hover{color:var(--accent)}

/* home ----------------------------------------------------------------- */
.home{max-width:560px;margin:0 auto;padding:2rem 0 2.4rem;text-align:center}
.home__portrait{width:100%;aspect-ratio:7/5;margin:0 auto 1.5rem;background-size:cover;background-position:center;background-color:#ecebe6}
.page__content h1.home__name{font-size:2rem;margin:0 0 .6rem}
.home__aff{margin:0 auto 1.5rem;max-width:46ch}
.home__role,.home__inst{display:block}
.home__role{font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:.55rem}
.home__inst{font-family:var(--display);font-style:italic;font-size:1rem;line-height:1.5;color:var(--muted)}
.home__bio{text-align:left;margin:0 auto 1.6rem;max-width:none}
.page__content .home__bio p{margin:0;font-family:var(--display);font-size:1.14rem;line-height:1.62;letter-spacing:.002em;color:var(--ink)}
.award{margin:0 auto 2rem;padding:1.3rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);max-width:46ch}
.award__label,.award__name,.award__org{display:block}
.award__label{font-size:.66rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:.5rem}
.award__name{font-family:var(--display);font-style:italic;font-size:1.06rem;line-height:1.35;color:var(--ink)}
.award__org{font-size:.82rem;color:var(--muted);margin-top:.3rem}
.home__links{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 1.4rem;font-size:.86rem;color:var(--muted)}
.home__links li{position:relative}
.home__links li + li::before{content:"";position:absolute;left:-.72rem;top:.28em;bottom:.28em;border-left:1px solid var(--edge)}
.home__links a{color:var(--ink);text-decoration:none}
.home__links a:hover{color:var(--accent)}
.home__links .ic{width:.9em;height:.9em;margin-right:.35em;vertical-align:-.1em;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:560px){.home{padding-top:2.6rem}.home__portrait{margin-bottom:1.8rem}.home__links{gap:.5rem 1.1rem}.home__links li + li::before{display:none}}

/* entries -------------------------------------------------------------- */
.item{display:grid;grid-template-columns:6.6rem 1fr;gap:1.1rem;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .y{font-family:var(--display);font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .t{font-family:var(--display);font-weight:400;font-size:1.06rem}
.item .s{font-family:var(--display);font-style:italic;font-size:1rem;color:var(--muted)}
.item .st{font-size:.76rem;color:var(--muted)}
@media(max-width:600px){.item{grid-template-columns:1fr;gap:.15rem}}

.latest{border-left:1px solid var(--edge);padding-left:1.2rem}
.tagline{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}

.qual{font-family:var(--display);font-style:italic;font-size:1rem;color:var(--muted);white-space:nowrap}

/* open tabs ------------------------------------------------------------ */
.think{border-top:1px solid var(--rule);padding:1.15rem 0;display:grid;grid-template-columns:5.5rem 1fr;gap:1.1rem}
.think:first-of-type{border-top:0}
.think .when{font-family:var(--mono);font-size:.7rem;color:var(--muted);padding-top:.3rem}
.think .what{font-family:var(--display);font-size:1.04rem;line-height:1.6;max-width:60ch}
.think .tags{margin-top:.5rem;display:flex;gap:.9rem;flex-wrap:wrap}
.think .tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--muted);background:none;border:0;padding:0}
.think .tag::before{content:"\00B7 ";color:var(--edge)}
@media(max-width:600px){.think{grid-template-columns:1fr;gap:.25rem}}

.invite{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:1rem 0;margin-top:1.4rem;font-family:var(--display);font-size:1.06rem;line-height:1.6;max-width:62ch;color:var(--ink)}

.invite p{margin:0;font-size:inherit;line-height:inherit;max-width:none}
.invite p + p{margin-top:.75rem}

/* gallery -------------------------------------------------------------- */
.gal{column-count:2;column-gap:20px}
@media(max-width:700px){.gal{column-count:1}}
.gal__item{break-inside:avoid;margin:0 0 20px}
.gal__item img{display:block;width:100%;height:auto;cursor:zoom-in;transition:opacity .18s ease}
.gal__item:hover img{opacity:.86}
.gal__item figcaption{font-size:.8rem;line-height:1.5;color:var(--muted);padding:.5rem 0 0;max-width:46ch}

.lb{position:fixed;inset:0;z-index:90;background:rgba(28,28,27,.95);display:flex;align-items:center;justify-content:center;padding:3vh 4vw;cursor:zoom-out}
.lb[hidden]{display:none}
.lb figure{margin:0;max-width:100%;max-height:100%;text-align:center}
.lb img{display:block;max-width:100%;max-height:84vh;width:auto;margin:0 auto}
.lb figcaption{color:#e4e2dd;font-size:.83rem;padding-top:.9rem;max-width:58ch;margin:0 auto}
.lb__close{position:absolute;top:.8rem;right:1.2rem;background:none;border:0;color:#e4e2dd;font-size:2rem;line-height:1;cursor:pointer;padding:.2rem .5rem}
.lb__close:hover{color:#fff}

.todo{border:1px solid var(--edge);color:var(--muted);padding:.7rem .85rem;font-size:.82rem;margin:0 0 1.05rem;max-width:64ch}
.todo code{font-family:var(--mono);font-size:.9em}

/* buttons -------------------------------------------------------------- */
.btn{display:inline-block;background:transparent;color:var(--ink);border:1px solid var(--edge);border-radius:0;padding:.5em 1.1em;font-size:.84rem;font-weight:400;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}

/* list-like sections --------------------------------------------------- */
.cvcols{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem 2.6rem;align-items:start}
@media(max-width:720px){.cvcols{grid-template-columns:1fr;gap:1.6rem}}
.glabel{font-family:var(--body);font-size:.66rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin:0 0 .5rem}
.item + .glabel{margin-top:1.6rem}
.glabel + .item{border-top:0}
.skills{display:flex;flex-wrap:wrap;gap:.35rem 1.1rem}
.skills span{font-size:.84rem;color:var(--muted);background:none;border:0;padding:0}

/* references ----------------------------------------------------------- */
.ref{padding:.95rem 0;border-bottom:1px solid var(--rule)}
.ref:last-child{border-bottom:0}
.cite{margin:0;padding-left:1.6em;text-indent:-1.6em;font-family:var(--display);font-size:1.06rem;line-height:1.6;color:var(--ink);max-width:none}
.cite a{word-break:break-word}
.blurb{margin-top:.7rem;margin-left:1.6em}

.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:1rem 0 .2rem;align-items:start}
.shots img{display:block;width:100%;height:auto}
.shots__cap{font-size:.76rem;line-height:1.45;color:var(--muted);margin:.5rem 0 0;max-width:none}

/* profile column ------------------------------------------------------- */
.profile{display:grid;gap:1.1rem;align-content:start}
.profile__list{list-style:none;margin:0;padding:0;font-size:.86rem}
.profile__list li{padding:.3rem 0;border-bottom:1px solid var(--rule);color:var(--muted)}
.profile__list li:last-child{border-bottom:0}
.profile__list a{color:var(--ink);text-decoration:none}
.profile__list a:hover{color:var(--accent)}
.profile__list .ic{width:.9em;height:.9em;margin-right:.45em;vertical-align:-.1em;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* reading -------------------------------------------------------------- */
.book{padding:1.3rem 0;border-top:1px solid var(--rule);max-width:64ch}
.book:first-of-type{border-top:0}
.book__title{font-family:var(--display);font-weight:400;font-size:1.06rem}
.book__author{font-family:var(--body);font-weight:400;font-size:.83rem;color:var(--muted);margin-left:.6em}
.book__note{margin:.45rem 0 0;font-family:var(--display);font-size:1.02rem;line-height:1.6}
.book__quote{margin:.8rem 0 0;padding-left:1.1rem;border-left:1px solid var(--edge);font-size:.89rem;font-style:italic;color:var(--muted);background:none}

.page__footer{max-width:780px;margin:1.5rem auto 0;padding:0 1.5rem 1.5rem;color:var(--muted);font-size:.82rem}
.page__footer footer{border-top:1px solid var(--rule);padding-top:1rem;line-height:1.7}
.page__footer a{color:var(--muted)}
.page__footer a:hover{color:var(--accent)}
</style>

<div class="masthead">
  <div class="mastinner">
    <a class="site-title" href="#" data-p="home">Simran Koul</a>
    <nav class="tabs"><!--TABS--></nav>
  </div>
</div>

<!--PANELS-->

<div class="page__footer"><footer>Last updated September 2026<br><a href="mailto:simran_koul@ucsb.edu">simran_koul@ucsb.edu</a></footer></div>

<script>
function show(slug) {
  document.querySelectorAll(".tab").forEach(function (x) {
    x.classList.toggle("is-active", x.dataset.p === slug);
  });
  document.querySelectorAll(".panel").forEach(function (x) {
    x.classList.toggle("is-active", x.id === slug);
  });
  window.scrollTo(0, 0);
}

document.querySelectorAll(".tab, .site-title").forEach(function (t) {
  t.addEventListener("click", function (e) { e.preventDefault(); show(t.dataset.p); });
});
</script>
